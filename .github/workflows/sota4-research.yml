name: ProofScope SOTA-4 one-process CJCS (research; development evidence, not a benchmark)

# Research branch only (research/sota4-oneprocess). Nothing here is blind, independent or a benchmark; no result
# may be reported as state-of-the-art. Every job uploads its evidence even when a check fails.
# Security: read-only token; no secrets; external repositories are cloned at pinned commits and never receive
# write permissions or secrets. The SOTA-3 run's artifacts are read with `actions: read` only.
on:
  workflow_dispatch:
  push:
    branches: [research/sota4-oneprocess]

permissions:
  contents: read
  actions: read

env:
  MATHLIB_REV: d13f23b723b8a846827a245b89c10fc7d3f11612
  REPL_REV: 193cf4bb9a22bb3fc6d25774f0fe6a70db1fd6ee
  SOTA3_RUN_ID: "42701174017"
  SEMANTEQ_REPO: https://github.com/hlxr89/SemantEq.git
  SEMANTEQ_REV: f92767000e14d11744580946980cf874324f5d19
  LEANINTERACT_REPO: https://github.com/augustepoiroux/LeanInteract.git
  LEANINTERACT_REV: 768e18ebcb5c7ec34d308768a785389eeac37798
  ASSESS_REPO: https://github.com/XiaoyangLiu-sjtu/ASSESS.git
  ASSESS_REV: bc7933547d8a6d1aaee41ccf56d68bc1f0fc575d

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen sources (v1.2 freeze; SOTA-3 research files; SOTA-3 start commit is an ancestor)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git merge-base --is-ancestor 379151101d81bdc0ac48064f2cf76fdb7612e0e6 HEAD
          grep -E '^[0-9a-f]{64}  [a-z]+/' proofscope/benchmark/V12_FREEZE.txt | sha256sum -c | tee evidence/v12-freeze.txt
          grep -E '^[0-9a-f]{64}  ' docs/sota4/SOTA3_FREEZE.txt | sha256sum -c | tee evidence/sota3-freeze.txt
          git diff 379151101d81bdc0ac48064f2cf76fdb7612e0e6 -- bench/runner.py | tee evidence/runner-diff.txt
          git diff --stat 379151101d81bdc0ac48064f2cf76fdb7612e0e6 -- research/cjcs/core_dev research/cjcs/core_heldout bench/dev_sota3 | tee evidence/dataset-diff.txt
          test ! -s evidence/dataset-diff.txt
      - name: Reproduce the SOTA-3 gate failure (recorded, expected to mismatch on the LF-terminated files)
        shell: bash
        run: |
          set -uo pipefail
          got=$(cat research/cjcs/core_heldout/*.json | sha256sum | cut -d' ' -f1)
          echo "raw concatenation: $got (SOTA-3 expected bb8628b61ff16efd674dc6380a94bc64f301f37ae273ae26f7768027b8a29495)" | tee evidence/sota3-gate-reproduction.txt
          for f in research/cjcs/core_heldout/*.json; do printf '%s %s last_byte=%s\n' "$(sha256sum "$f" | cut -c1-16)" "$f" "$(tail -c1 "$f" | od -An -tx1 | tr -d ' ')"; done | tee -a evidence/sota3-gate-reproduction.txt
      - name: Canonical-JSON manifests (held-out reproduces the recorded SOTA-3 digest byte-for-byte modulo one LF)
        shell: bash
        run: |
          set -euo pipefail
          python -m bench.sota4.integrity verify --require-legacy research/cjcs/core_heldout.MANIFEST.json research/cjcs/core_dev.MANIFEST.json | tee evidence/manifests.jsonl
          python -m unittest tests.sota4.test_integrity -v 2>&1 | tee evidence/integrity-tests.log
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-integrity
          path: evidence/
          if-no-files-found: warn

  theory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: CJCS theory, unchanged (9 axiom-free, 5 standard classical, 1 propext+Quot.sound; leanchecker --fresh)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj" evidence
          lean -o "$RUNNER_TEMP/cj/CJCS.olean" research/cjcs/CJCS.lean 2>&1 | tee evidence/cjcs-axioms.log
          test "$(grep -c 'does not depend on any axioms' evidence/cjcs-axioms.log)" = 9
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' evidence/cjcs-axioms.log)" = 5
          test "$(grep -c 'depends on axioms: \[propext, Quot.sound\]' evidence/cjcs-axioms.log)" = 1
          ! grep -q sorryAx evidence/cjcs-axioms.log
          (cd "$RUNNER_TEMP/cj" && LEAN_PATH="$RUNNER_TEMP/cj" leanchecker --fresh CJCS) 2>&1 | tee evidence/cjcs-leanchecker.log
      - name: Search module compiles (untrusted; no theorems)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s/ProofScope"
          (cd lean && lean -o "$RUNNER_TEMP/s/ProofScope/CJCSSearch.olean" ProofScope/CJCSSearch.lean) 2>&1 | tee evidence/cjcssearch-build.log
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-theory
          path: evidence/
          if-no-files-found: warn

  core-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Lean REPL (leanprover-community/repl v4.34.0, pinned commit; built with Lean 4.34.1)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl" && git checkout -q "$REPL_REV"
          test "$(git rev-parse HEAD)" = "$REPL_REV"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl 2>&1 | tail -n 5
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Held-out integrity before the run
        run: python -m bench.sota4.integrity verify --require-legacy research/cjcs/core_heldout.MANIFEST.json
      - name: Unchanged SOTA-3 engine on the core suites (Task C; every verdict kept)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          python -m proofscope.experimental.cjcs run research/cjcs/core_dev/*.json --out evidence/sota3/core_dev --jobs 1 2>&1 | tee evidence/sota3-core_dev.log
          python -m proofscope.experimental.cjcs run research/cjcs/core_heldout/*.json --out evidence/sota3/core_heldout --jobs 1 2>&1 | tee evidence/core_heldout.log
      - name: SOTA-4 engine on the same suites
        shell: bash
        run: |
          set -uo pipefail
          python -m proofscope.experimental.cjcs4 run research/cjcs/core_dev/*.json --out evidence/sota4/core_dev --jobs 1 2>&1 | tee evidence/sota4-core_dev.log
          python -m proofscope.experimental.cjcs4 run research/cjcs/core_heldout/*.json --out evidence/sota4/core_heldout --jobs 1 2>&1 | tee evidence/sota4-core_heldout.log
      - name: Held-out acceptance (no must-not violation; every certificate axiom-audited and replayed)
        shell: bash
        run: |
          set -euo pipefail
          python -m bench.sota4.report core --dirs evidence/sota3/core_heldout evidence/sota4/core_heldout evidence/sota3/core_dev evidence/sota4/core_dev --out evidence/core_verdicts.json | tee evidence/core_verdicts.md
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-core-heldout
          path: evidence/
          if-no-files-found: warn

  soundness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Lean REPL (leanprover-community/repl v4.34.0, pinned commit; built with Lean 4.34.1)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl" && git checkout -q "$REPL_REV"
          test "$(git rev-parse HEAD)" = "$REPL_REV"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl 2>&1 | tail -n 5
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Hostile controls and unit tests (engine, limiter, SOTA-3 CJCS controls)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m unittest tests.sota4.test_engine_hostile tests.bench.test_bench tests.bench.test_cjcs -v 2>&1 | tee evidence/unit-tests.log
      - name: Hostile suite, both engines, case level
        shell: bash
        run: |
          set -uo pipefail
          python -m bench.sota4.measure --prebuilt --engine cjcs --engine cjcs4 --specs research/cjcs/sota4_hostile/*.json --out evidence/hostile 2>&1 | tee evidence/hostile.log
          python -m bench.sota4.report hostile --records evidence/hostile/records.json | tee evidence/hostile.md
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-soundness
          path: |
            evidence/
            !evidence/**/shim/**
          if-no-files-found: warn

  performance-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Lean REPL (leanprover-community/repl v4.34.0, pinned commit; built with Lean 4.34.1)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl" && git checkout -q "$REPL_REV"
          test "$(git rev-parse HEAD)" = "$REPL_REV"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl 2>&1 | tail -n 5
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Core suites (24 pairs), both engines; variant A (benchmark shape) and B (prebuilt), case level
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          S="research/cjcs/core_dev/*.json research/cjcs/core_heldout/*.json"
          python -m bench.sota4.measure --engine cjcs --engine cjcs4 --specs $S --out evidence/core-A 2>&1 | tee evidence/core-A.log
          python -m bench.sota4.measure --prebuilt --engine cjcs --engine cjcs4 --specs $S --out evidence/core-B 2>&1 | tee evidence/core-B.log
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-performance
          path: |
            evidence/
            !evidence/**/shim/**
            !evidence/**/build/**
          if-no-files-found: warn

  mathlib-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Mathlib at the pinned revision (binary cache)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ml" && cd "$RUNNER_TEMP/ml"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          printf '%s\n' 'name = "pscheck"' 'defaultTargets = []' '' '[[require]]' 'name = "mathlib"' \
            'git = "https://github.com/leanprover-community/mathlib4"' "rev = \"$MATHLIB_REV\"" > lakefile.toml
          for i in 1 2 3; do lake update && break || sleep 30; done
          for i in 1 2 3; do lake exe cache get && break || sleep 60; done
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Lean REPL (leanprover-community/repl v4.34.0, pinned commit; built with Lean 4.34.1)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl" && git checkout -q "$REPL_REV"
          test "$(git rev-parse HEAD)" = "$REPL_REV"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl 2>&1 | tail -n 5
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Mathlib development suite (24 pairs), SOTA-3 vs SOTA-4, no budget (measurement ceiling 900 CPU-s), case level
        env:
          PROOFSCOPE_IMPORTS: Mathlib
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          python -m bench.sota4.specs --cases bench/dev_sota3/combined.cases.jsonl --gold bench/dev_sota3/gold_provisional.jsonl --shard ${{ matrix.shard }}/4 --out specs
          python -m bench.sota4.measure --engine cjcs --engine cjcs4 --specs specs/*.json --cpu-ceiling 900 --mem-mb 14000 --out evidence/mathlib-A-${{ matrix.shard }} 2>&1 | tee evidence/mathlib-A-${{ matrix.shard }}.log
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-performance-mathlib-${{ matrix.shard }}
          path: |
            evidence/
            specs/
            !evidence/**/shim/**
            !evidence/**/build/**
          if-no-files-found: warn

  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        system: [proofscope, cjcs, cjcs4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Mathlib at the pinned revision (binary cache)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ml" && cd "$RUNNER_TEMP/ml"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          printf '%s\n' 'name = "pscheck"' 'defaultTargets = []' '' '[[require]]' 'name = "mathlib"' \
            'git = "https://github.com/leanprover-community/mathlib4"' "rev = \"$MATHLIB_REV\"" > lakefile.toml
          for i in 1 2 3; do lake update && break || sleep 30; done
          for i in 1 2 3; do lake exe cache get && break || sleep 60; done
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Lean REPL (leanprover-community/repl v4.34.0, pinned commit; built with Lean 4.34.1)
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl" && git checkout -q "$REPL_REV"
          test "$(git rev-parse HEAD)" = "$REPL_REV"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl 2>&1 | tail -n 5
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Benchmark harness, unchanged policy (tier 20 CPU-s + measured startup allowance; 12000 MB)
        shell: bash
        run: |
          set -euo pipefail
          python -m bench.runner --system ${{ matrix.system }} --cases 'bench/dev_sota3/combined.cases.jsonl' --tier 20 \
            --startup-allowance measure --mem-mb 12000 --repeat 1 --shard ${{ matrix.shard }}/4 --out runs | tee runs-${{ matrix.system }}-${{ matrix.shard }}.log
      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-development-${{ matrix.system }}-${{ matrix.shard }}
          path: |
            runs/
            !runs/work/**/ps_out/build/**
            runs-*.log
          if-no-files-found: warn

  semanteq:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SemantEq at the pinned commit, native toolchain and Mathlib (its own lockfile)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git init -q "$RUNNER_TEMP/se" && cd "$RUNNER_TEMP/se"
          git remote add origin "$SEMANTEQ_REPO" && git fetch -q --depth 1 origin "$SEMANTEQ_REV" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SEMANTEQ_REV"
          for i in 1 2 3; do lake exe cache get && break || sleep 60; done
          lake build semanteq 2>&1 | tail -5
      - name: SemantEq upstream check (two pairs of its own recall suite, compared with its own manifest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p se-evidence
          cd "$RUNNER_TEMP/se"
          grep -E '"id": "auto:Compfiles:(Imo1963P5|Imo1983P1)"' test/eval/recall/suite.jsonl > /tmp/se_upstream.jsonl
          test "$(wc -l < /tmp/se_upstream.jsonl)" = 2
          lake exe semanteq --raw --timeout 0 /tmp/se_upstream.jsonl /tmp/se_upstream_out.jsonl > "$GITHUB_WORKSPACE/se-evidence/upstream-stdout.log" 2>&1
          cp /tmp/se_upstream_out.jsonl "$GITHUB_WORKSPACE/se-evidence/"
          python - <<'PY'
          import json
          acc = {"ExactMatch", "DefEq", "EquivalentRestricted"}
          man = {r["id"]: r for r in map(json.loads, open("test/eval/recall/manifest.jsonl"))}
          out = [r for r in map(json.loads, open("/tmp/se_upstream_out.jsonl")) if "_meta" not in r]
          assert len(out) == 2, out
          for r in out:
              want = man[r["id"]]["default_search_accepts"]
              got = r["verdict"] in acc
              print(r["id"], r["verdict"], "accepts" if got else "rejects", "manifest:", want)
              assert got == want, f"SemantEq does not reproduce its own manifest on {r['id']}"
          print("SEMANTEQ_UPSTREAM_OK")
          PY
      - name: Run (shard ${{ matrix.shard }}/4)
        shell: bash
        run: |
          set -euo pipefail
          A=measure
          python -m bench.runner --system semanteq --tool-dir "$RUNNER_TEMP/se" --cases 'bench/dev_sota3/combined.cases.jsonl' \
            --tier 20 --startup-allowance "$A" --mem-mb 14000 --repeat 1 --shard ${{ matrix.shard }}/4 \
            --out runs | tee runs-semanteq-${{ matrix.shard }}.log
      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-development-semanteq-${{ matrix.shard }}
          path: |
            runs/
            runs-semanteq-*.log
            se-evidence/
          if-no-files-found: warn

  beqplus:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # INFRASTRUCTURE. LeanInteract's `check_lake` runs a bare `lake --version` outside any project, so elan
      # needs a default toolchain (run 42687906199: "error: no default toolchain configured"). Project
      # commands are unaffected: LeanInteract calls `lake +v4.8.0 init` and the REPL/project directories
      # carry their own lean-toolchain files. The default is pinned to the version upstream's driver uses.
      - name: elan with pinned default toolchain leanprover/lean4:v4.8.0 (BEq+ upstream driver version)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p beq-evidence
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          for i in 1 2 3; do elan toolchain install leanprover/lean4:v4.8.0 && break; [ "$i" = 3 ] && { echo "INFRASTRUCTURE_ERROR: toolchain install failed"; exit 1; }; sleep 20; done
          elan default leanprover/lean4:v4.8.0
          { elan --version; elan show; lean --version; lake --version; } 2>&1 | tee beq-evidence/toolchain-${{ matrix.shard }}.txt
          lean --version | grep -q "version 4.8.0" || { echo "INFRASTRUCTURE_ERROR: lean is not 4.8.0"; exit 1; }
      - name: LeanInteract at the pinned commit (BEq+ source) and its REPL project (Lean v4.8.0 + Mathlib, as upstream's driver)
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/li" && cd "$RUNNER_TEMP/li"
          git remote add origin "$LEANINTERACT_REPO" && git fetch -q --depth 1 origin "$LEANINTERACT_REV" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LEANINTERACT_REV"
          pip install -q . rich tqdm scikit-learn datasets 2>&1 | tee "$GITHUB_WORKSPACE/beq-evidence/pip-${{ matrix.shard }}.log"
          pip freeze > "$GITHUB_WORKSPACE/beq-evidence/pip-freeze-${{ matrix.shard }}.txt"
          # warm the REPL project once (setup cost, reported separately from per-pair budgets)
          python -c "from lean_interact import LeanREPLConfig, TempRequireProject; LeanREPLConfig(project=TempRequireProject(lean_version='v4.8.0', require='mathlib'), verbose=True)" \
            2>&1 | tail -n 200 | tee "$GITHUB_WORKSPACE/beq-evidence/repl-setup-${{ matrix.shard }}.log"
      - name: Native BEq+ initialization check (REPL starts, Mathlib imports, one trivial command elaborates)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/li"
          python - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/beq-evidence/init-check-${{ matrix.shard }}.log"
          import time
          from lean_interact import AutoLeanServer, Command, LeanREPLConfig, TempRequireProject
          t = time.time()
          s = AutoLeanServer(config=LeanREPLConfig(project=TempRequireProject(lean_version="v4.8.0", require="mathlib")))
          r = s.run(Command(cmd="import Mathlib\ntheorem init_check (x : ℝ) : x + 0 = x := by simp"), timeout=600)
          print("response:", r)
          assert r.lean_code_is_valid(allow_sorry=False), "INIT_CHECK_FAILED: Mathlib command did not elaborate"
          print(f"BEQPLUS_INIT_OK {time.time() - t:.1f}s")
          PY
      - name: Run (shard ${{ matrix.shard }}/4)
        shell: bash
        run: |
          set -euo pipefail
          A=measure
          python -m bench.runner --system beqplus --tool-dir "$RUNNER_TEMP/li" --beq-lean-version v4.8.0 \
            --cases 'bench/dev_sota3/combined.cases.jsonl' --tier 20 --startup-allowance "$A" --mem-mb 14000 --repeat 1 \
            --shard ${{ matrix.shard }}/4 --out runs | tee runs-beqplus-${{ matrix.shard }}.log
      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-development-beqplus-${{ matrix.shard }}
          path: |
            runs/
            runs-beqplus-*.log
            beq-evidence/
          if-no-files-found: warn

  summary:
    needs: [integrity, theory, core-heldout, soundness, performance-core, mathlib-measure, development, semanteq, beqplus]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota4-oneprocess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: sota4-development-*
          path: shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sota4-performance-mathlib-*
          path: mathlib
      - name: SOTA-3 run artifacts (read-only, for the 16-failure analysis)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sota3-runs-cjcs-*
          path: sota3
          merge-multiple: true
          run-id: ${{ env.SOTA3_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Failure analysis (SOTA-3 original records; SOTA-3 and SOTA-4 re-runs)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p summary
          python -m bench.sota4.failures --records sota3/runs/cjcs --work sota3/runs/work/cjcs/t20 --out summary/failures-sota3-original.json | tee summary/failures-sota3-original.txt
          python -m bench.sota4.failures --records shards/runs/cjcs --out summary/failures-sota3-rerun.json | tee summary/failures-sota3-rerun.txt
          python -m bench.sota4.failures --records shards/runs/cjcs4 --out summary/failures-sota4.json | tee summary/failures-sota4.txt
      - name: Evaluation B (native and certified outcomes; provisional developer labels; not a benchmark)
        shell: bash
        run: |
          set -uo pipefail
          echo "## DEVELOPMENT ONLY: provisional, non-independent labels; 24 pairs; no superiority claim" | tee -a "$GITHUB_STEP_SUMMARY"
          cat bench/fixtures/availability.cases.jsonl > summary/fixtures.jsonl
          python -m bench.gate --runs shards --cases summary/fixtures.jsonl --tier 20 --out summary/availability.json --markdown summary/availability.md | tee -a "$GITHUB_STEP_SUMMARY"
          python -m bench.score --runs shards/runs --gold bench/dev_sota3/gold_provisional.jsonl --tier 20 \
            --out summary/dev_metrics.json --markdown summary/dev_report.md | tee -a "$GITHUB_STEP_SUMMARY"
          python -m bench.sota4.report summary --mathlib mathlib --runs shards/runs --out summary/sota4_summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (also when verification fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota4-summary
          path: |
            summary/
            shards/
            mathlib/
          if-no-files-found: warn
