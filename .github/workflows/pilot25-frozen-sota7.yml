name: ProofScope Pilot-25 frozen SOTA-7 actual external AI-sourced cases (no gold)
on:
  push:
    branches:
      - research/pilot25-frozen-sota7-execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pilot25-frozen-sota7-execution
          fetch-depth: 0
          persist-credentials: false
      - name: Verify engine untouched
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "666c873371f30fe7d79a7b46f607e425ad7d1bd4"
          git diff --exit-code 666c873371f30fe7d79a7b46f607e425ad7d1bd4 HEAD -- proofscope lean bench/sota7 bench/sota4
          echo "FROZEN_ENGINE_UNCHANGED"

  pilot-run:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pilot25-frozen-sota7-execution
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Lean 4.34.1
        uses: ./.github/actions/setup-lean
      - name: Install pinned Mathlib and precompiled cache
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib4"
          cd "$RUNNER_TEMP/mathlib4"
          git checkout -q d13f23b723b8a846827a245b89c10fc7d3f11612
          test "$(git rev-parse HEAD)" = "d13f23b723b8a846827a245b89c10fc7d3f11612"
          lake update
          lake exe cache get
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Build pinned Lean REPL for frozen engine
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl"
          git checkout -q 193cf4bb9a22bb3fc6d25774f0fe6a70db1fd6ee
          test "$(git rev-parse HEAD)" = "193cf4bb9a22bb3fc6d25774f0fe6a70db1fd6ee"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Run all 23 convertible cases; preserve complete results including failures
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p pilot25_results
          python -m bench.pilot25_run.execute > pilot25_results/runner.log 2>&1
          rc=$?
          cat pilot25_results/runner.log
          echo "$rc" > pilot25_results/runner_exit_code.txt
          exit "$rc"
      - name: Independently replay generated certificates, if execution sealed
        if: always()
        shell: bash
        run: |
          if [ -f pilot25_results/execution/seal.json ]; then
            python -m bench.sota7.replay --run pilot25_results/execution --public bench/pilot25_run/public --out pilot25_results/replay.jsonl > pilot25_results/replay.log 2>&1
            cat pilot25_results/replay.log
          else
            echo "NOT_RUN: execution not sealed" > pilot25_results/replay.log
          fi
      - name: Upload unscored records and logs regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot25-frozen-sota7-raw-evidence
          path: |
            pilot25_results/
            bench/pilot25_run/public/
          if-no-files-found: warn
