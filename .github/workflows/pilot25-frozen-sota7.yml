name: ProofScope Pilot-25 frozen SOTA-7 actual external AI-sourced cases (no gold)
on:
  push:
    branches:
      - research/pilot25-frozen-sota7-execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pilot25-frozen-sota7-execution
          fetch-depth: 0
          persist-credentials: false
      - name: Verify engine untouched
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 666c873371f30fe7d79a7b46f607e425ad7d1bd4 HEAD
          git diff --exit-code 666c873371f30fe7d79a7b46f607e425ad7d1bd4 HEAD -- proofscope lean bench/sota7 bench/sota4
          echo "FROZEN_ENGINE_UNCHANGED"

  pilot-run:
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pilot25-frozen-sota7-execution
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Lean 4.34.1
        uses: ./.github/actions/setup-lean
      - name: Install pinned Mathlib and precompiled cache
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib4"
          cd "$RUNNER_TEMP/mathlib4"
          git checkout -q d13f23b723b8a846827a245b89c10fc7d3f11612
          test "$(git rev-parse HEAD)" = "d13f23b723b8a846827a245b89c10fc7d3f11612"
          # Never run lake update: it upgrades pinned dependencies from Mathlib's lockfile.
          git diff --exit-code -- lake-manifest.json lean-toolchain
          cp lake-manifest.json "$RUNNER_TEMP/mathlib-lock-original.json"
          lake exe cache get
          cmp lake-manifest.json "$RUNNER_TEMP/mathlib-lock-original.json" || { echo "::error::Mathlib dependency lockfile changed"; exit 1; }
          if [ ! -s .lake/build/lib/lean/Mathlib.olean ]; then
            echo "Prebuilt Mathlib.olean missing; using exact locked dependencies for fallback build"
            lake build Mathlib
          fi
          test -s .lake/build/lib/lean/Mathlib.olean
          cmp lake-manifest.json "$RUNNER_TEMP/mathlib-lock-original.json"
          echo "Pinned Mathlib.olean available with original dependency lockfile"
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Build pinned Lean REPL for frozen engine
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/leanprover-community/repl "$RUNNER_TEMP/repl"
          cd "$RUNNER_TEMP/repl"
          git checkout -q 193cf4bb9a22bb3fc6d25774f0fe6a70db1fd6ee
          test "$(git rev-parse HEAD)" = "193cf4bb9a22bb3fc6d25774f0fe6a70db1fd6ee"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          lake build repl
          echo "PROOFSCOPE_REPL=$RUNNER_TEMP/repl/.lake/build/bin/repl" >> "$GITHUB_ENV"
      - name: Diagnose frozen Lean REPL search initialization (no case outputs or gold)
        shell: bash
        env:
          PROOFSCOPE_IMPORTS: Mathlib
        run: |
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          from proofscope import adelta12 as A
          from proofscope.experimental import cjcs4
          from proofscope.toolchain import Toolchain
          with tempfile.TemporaryDirectory() as temp:
              d=Path(temp)
              tc=Toolchain.find()
              compiled=A.build(tc,d/"build")
              print("EXTRACTOR_BUILD",json.dumps(compiled)[:6000],flush=True)
              if not compiled["ok"]:
                  raise SystemExit("Extractor module did not compile")
              lp=os.pathsep.join((str(d/"build"),os.environ.get("LEAN_PATH","")))
              for tag,imports in (("LEAN", "import Lean\n#check Lean.Name\n"), ("MATHLIB", "import Mathlib\n#check Nat\n"), ("COMBINED","import Lean\nimport Mathlib\nimport ProofScope.AssumptionExtract11\n#check Lean.Name\n")):
                  file=d/(tag+".lean")
                  file.write_text(imports)
                  cr=tc.run([tc.lean,str(file)],extra_path=d/"build",timeout=120)
                  print("LEAN_FILE_PROBE",tag,"returncode",cr.returncode,"output",cr.output[-2500:],flush=True)
                  rr=cjcs4.Repl(cjcs4.find_repl(),lp,d)
                  try:
                      res=rr.send(imports,None)
                      print("REPL_IMPORT_PROBE",tag,json.dumps(res.get("messages",[]),ensure_ascii=False)[:3500],flush=True)
                  finally: rr.close()
              r=cjcs4.Repl(cjcs4.find_repl(),lp,d)
              try:
                  source="import Lean\n"+A.import_lines()+"import ProofScope.AssumptionExtract11\n"+cjcs4.search_source()+"\nset_option linter.unusedVariables false"
                  result=r.send(source,None)
                  print("INIT_ENV",result.get("env"),flush=True)
                  print("INIT_MESSAGES",json.dumps(result.get("messages",[]),ensure_ascii=False)[:12000],flush=True)
                  if result.get("env") is None or cjcs4._errors(result):
                      raise SystemExit("REPL_INIT_FAILED_DIAGNOSTIC")
              finally: r.close()
          PY
      - name: Run all 23 convertible cases; preserve complete results including failures
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p pilot25_results
          python -m bench.pilot25_run.execute > pilot25_results/runner.log 2>&1
          rc=$?
          cat pilot25_results/runner.log
          echo "$rc" > pilot25_results/runner_exit_code.txt
          exit "$rc"
      - name: Independently replay generated certificates, if execution sealed
        if: always()
        shell: bash
        run: |
          if [ -f pilot25_results/execution/seal.json ]; then
            python -m bench.sota7.replay --run pilot25_results/execution --public bench/pilot25_run/public --out pilot25_results/replay.jsonl > pilot25_results/replay.log 2>&1
            cat pilot25_results/replay.log
          else
            mkdir -p pilot25_results
            echo "NOT_RUN: execution not sealed" > pilot25_results/replay.log
          fi
      - name: Upload unscored records and logs regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot25-frozen-sota7-raw-evidence
          path: |
            pilot25_results/
            bench/pilot25_run/public/
          if-no-files-found: warn
