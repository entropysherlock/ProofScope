name: ProofScope Project Audit

# Audit a pinned public Lean project (v0.2).
#
# Security model
# - Manual trigger only. GitHub lets only people with write access to this repository start it.
# - The job token is read-only, checkout does not store it, and no secrets are referenced.
# - Every input is passed through environment variables (never pasted into shell code) and validated
#   in Python: GitHub URL, full 40-hex commit, safe subdirectory, well-formed Lean names.
# - With "build" off (the default) no code from the audited project is executed: it is fetched and read
#   as text. With "build" on, Lake and Lean run the project's code inside this throwaway runner, which
#   holds no credentials; the uploaded report is the only output.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Public GitHub repository (https://github.com/OWNER/REPO)"
        required: true
        default: "https://github.com/openai/math"
      commit:
        description: "Full 40-character commit SHA (branches and tags are refused)"
        required: true
        default: "4eaee87548250b2682affda7d05d947c05554bae"
      subdir:
        description: "Directory containing the Lake project (blank = repository root)"
        required: false
        default: "lean"
      modules:
        description: "Target Lean modules, space-separated (optional)"
        required: false
        default: ""
      decls:
        description: "Declarations to axiom-audit, space-separated (used when build is on)"
        required: false
        default: ""
      catalog:
        description: "Check formalization.yaml main results (if the project has one)"
        type: boolean
        default: true
      catalog_targets:
        description: "Also audit the first N catalog main results as targets (0 = none)"
        required: false
        default: "0"
      build:
        description: "Build, #print axioms and leanchecker replay (slow; runs the project's code in this sandbox)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Pinned project audit
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout ProofScope
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --quiet "pyyaml==6.0.2"
      - name: Free disk space for large builds
        if: ${{ inputs.build }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install elan (the project's own lean-toolchain is honoured)
        if: ${{ inputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run ProofScope project audit
        shell: bash
        env:
          PS_REPO: ${{ inputs.repo }}
          PS_COMMIT: ${{ inputs.commit }}
          PS_SUBDIR: ${{ inputs.subdir }}
          PS_MODULES: ${{ inputs.modules }}
          PS_DECLS: ${{ inputs.decls }}
          PS_CATALOG: ${{ inputs.catalog }}
          PS_CATALOG_TARGETS: ${{ inputs.catalog_targets }}
          PS_BUILD: ${{ inputs.build }}
        run: |
          set -uo pipefail
          args=(--repo "$PS_REPO" --commit "$PS_COMMIT" --subdir "$PS_SUBDIR"
                --output proofscope-project-evidence --workdir "$RUNNER_TEMP/project-src")
          [ -n "$PS_MODULES" ] && args+=(--modules "$PS_MODULES")
          [ -n "$PS_DECLS" ] && args+=(--decls "$PS_DECLS")
          [ "$PS_CATALOG" = "true" ] && args+=(--catalog)
          if [[ "$PS_CATALOG_TARGETS" =~ ^[0-9]{1,3}$ ]]; then args+=(--catalog-targets "$PS_CATALOG_TARGETS"); fi
          [ "$PS_BUILD" = "true" ] && args+=(--build)
          python -m proofscope.project "${args[@]}"
      - name: Job summary
        if: always()
        run: cat proofscope-project-evidence/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence (even if the audit reports FAIL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofscope-project-evidence
          path: proofscope-project-evidence/
          if-no-files-found: warn
          retention-days: 30
