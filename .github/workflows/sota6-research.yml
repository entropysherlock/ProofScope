name: ProofScope SOTA-6 certified semantic auditor (research; development evidence, not a benchmark)

# Research branch research/sota6-certified-semantic-auditor only. Read-only token, no secrets; external repositories
# are cloned at pinned commits. Research acceptance checks are reported in sota5-summary; a green run does
# not mean every research criterion passed.
on:
  workflow_dispatch:
  push:
    branches: [research/sota6-certified-semantic-auditor]

permissions:
  contents: read

env:
  MATHLIB_REV: d13f23b723b8a846827a245b89c10fc7d3f11612
  REPL_REV: 193cf4bb9a22bb3fc6d25774f0fe6a70db1fd6ee

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota6-certified-semantic-auditor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: SOTA-4 base, frozen sources and datasets unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git merge-base --is-ancestor 8affd967175c4629bf6e75cc03d44f01419c025e HEAD
          grep -E '^[0-9a-f]{64}  [a-z]+/' proofscope/benchmark/V12_FREEZE.txt | sha256sum -c | tee evidence/v12-freeze.txt
          grep -E '^[0-9a-f]{64}  ' docs/sota4/SOTA3_FREEZE.txt | sha256sum -c | tee evidence/sota3-freeze.txt
          python -m bench.sota4.integrity verify --require-legacy research/cjcs/core_heldout.MANIFEST.json research/cjcs/core_dev.MANIFEST.json | tee evidence/manifests.jsonl
          git diff --stat 8affd967175c4629bf6e75cc03d44f01419c025e -- research/cjcs/core_dev research/cjcs/core_heldout research/cjcs/sota4_hostile research/cjcs/sota5_hostile research/sota5 bench/sota5 bench/dev_sota3 bench/fixtures docs/sota4 docs/sota5 proofscope/experimental/cjcs4.py proofscope/experimental/lawrel.py proofscope/experimental/relations.py proofscope/experimental/cjcs.py lean/ProofScope bench/adapters bench/runner.py | tee evidence/protected-diff.txt
          test ! -s evidence/protected-diff.txt
      - name: Upload evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota6-baseline
          path: evidence/
          if-no-files-found: warn

  theory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota6-certified-semantic-auditor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Repair.lean and Relations.lean (no sorryAx, standard axioms, leanchecker --fresh)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/r"
          for m in sota6/Repair sota5/Relations; do
            b=$(basename $m)
            lean -o "$RUNNER_TEMP/r/$b.olean" research/$m.lean 2>&1 | tee evidence/$b-axioms.log
            ! grep -q 'sorryAx\|: error' evidence/$b-axioms.log
            ! grep "depends on axioms" evidence/$b-axioms.log | grep -vE 'axioms: \[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]$'
            (cd "$RUNNER_TEMP/r" && LEAN_PATH="$RUNNER_TEMP/r" leanchecker --fresh $b) 2>&1 | tee evidence/$b-leanchecker.log
          done
          test "$(grep -c "depends on axioms\|does not depend on any axioms" evidence/Repair-axioms.log)" = 9
      - name: Upload evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota6-theory
          path: evidence/
          if-no-files-found: warn

  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota6-certified-semantic-auditor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Certified minimal repair on the three demonstrations (timed), adversarial tests, SOTA-5 law-relative tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for r in r1_division_nonzero r2_square_order r3_conclusion_disjunct; do
            /usr/bin/time -v python -m proofscope.experimental.repair research/sota6/repair/$r.json --out evidence/repair/$r 2> evidence/repair-$r.time | tee evidence/repair-$r.log
          done
          python -m unittest tests.sota6.test_repair tests.sota5.test_lawrel -v 2>&1 | tee evidence/tests.log
      - name: Upload evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota6-repair
          path: |
            evidence/
            !evidence/**/build/**
          if-no-files-found: warn

  mathlib-d11:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: research/sota6-certified-semantic-auditor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean 4.34.1 (pinned SHA-256; fails closed)
        uses: ./.github/actions/setup-lean
      - name: Mathlib at the pinned revision (binary cache)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ml" && cd "$RUNNER_TEMP/ml"
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          printf '%s\n' 'name = "pscheck"' 'defaultTargets = []' '' '[[require]]' 'name = "mathlib"' \
            'git = "https://github.com/leanprover-community/mathlib4"' "rev = \"$MATHLIB_REV\"" > lakefile.toml
          for i in 1 2 3; do lake update && break || sleep 30; done
          for i in 1 2 3; do lake exe cache get && break || sleep 60; done
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: d11 against Mathlib's Group (compile, axioms, leanchecker)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence "$RUNNER_TEMP/d"
          lean -o "$RUNNER_TEMP/d/D11Mathlib.olean" research/sota6/D11Mathlib.lean 2>&1 | tee evidence/d11-axioms.log
          echo "compile rc=${PIPESTATUS[0]}" | tee -a evidence/d11-axioms.log
          (cd "$RUNNER_TEMP/d" && LEAN_PATH="$RUNNER_TEMP/d:$LEAN_PATH" leanchecker D11Mathlib) 2>&1 | tee evidence/d11-leanchecker.log
          echo "leanchecker rc=${PIPESTATUS[0]}" | tee -a evidence/d11-leanchecker.log
      - name: Upload evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sota6-mathlib-d11
          path: evidence/
          if-no-files-found: warn
