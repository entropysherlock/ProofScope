name: FormalMATH certificates — reproduce on two pinned toolchains

# A) FormalMATH's own evaluation environment: Lean v4.11.0 + Mathlib 8edf04f (repl@adbbfcb test/Mathlib manifest)
# B) ProofScope's environment: Lean v4.34.1 + Mathlib d13f23b, plus leanchecker replay
on:
  workflow_dispatch:
  push:
    branches: [research/defect-hunt-ci]
    paths: ["experiments/defect_hunt/formalmath/certificates/**", ".github/workflows/formalmath-certificates.yml"]

permissions:
  contents: read

jobs:
  formalmath-pin:
    name: "A: Lean 4.11.0 + Mathlib 8edf04f (FormalMATH's environment)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: elan + Lean 4.11.0, Mathlib 8edf04f from the precompiled cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p ~/fm && cd ~/fm
          echo "leanprover/lean4:v4.11.0" > lean-toolchain
          printf '%s\n' 'name = "fmcert"' 'defaultTargets = []' '' '[[require]]' 'name = "mathlib"' \
            'git = "https://github.com/leanprover-community/mathlib4"' 'rev = "8edf04f0977c3183d3b633792e03fd570be1777f"' > lakefile.toml
          lake update 2>&1 | tail -3
          grep -A3 '"name": "mathlib"' lake-manifest.json | head -3 || true
          grep -q 8edf04f0977c3183d3b633792e03fd570be1777f lake-manifest.json
          for i in 1 2 3; do lake exe cache get && break || sleep 30; done
          lean --version
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Verify certificates
        shell: bash
        run: set -o pipefail; experiments/defect_hunt/formalmath/certificates/verify.sh experiments/defect_hunt/formalmath/certificates out-A | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificates-A-lean4.11.0
          path: out-A

  proofscope-pin:
    name: "B: Lean 4.34.1 + Mathlib d13f23b + leanchecker"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: Mathlib d13f23b (precompiled cache)
        shell: bash
        run: |
          set -euo pipefail
          M=~/mathlib4; mkdir -p $M; cd $M
          git init -q && git remote add origin https://github.com/leanprover-community/mathlib4
          git fetch -q --depth 1 origin d13f23b723b8a846827a245b89c10fc7d3f11612 && git checkout -q FETCH_HEAD
          for i in 1 2 3; do lake exe cache get && break || sleep 30; done
          echo "LEAN_PATH=$(lake env printenv LEAN_PATH)" >> "$GITHUB_ENV"
      - name: Verify certificates (+ leanchecker replay)
        shell: bash
        run: set -o pipefail; experiments/defect_hunt/formalmath/certificates/verify.sh experiments/defect_hunt/formalmath/certificates out-B "$(dirname "$(which lean)")/leanchecker" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificates-B-lean4.34.1
          path: out-B
