name: ProofScope Fidelity

# Definition-fidelity benchmark (v0.2): kernel controls plus Lean-checked certificates that pairs of
# definitions agree or disagree on the domain a theorem uses. Core Lean only; no Mathlib download.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/proofscope-fidelity.yml"
      - "proofscope/**"
      - "tests/v02/**"
      - "examples/lean/**"

permissions:
  contents: read

jobs:
  fidelity:
    name: Definition-fidelity certificates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (catalog tests)
        run: python -m pip install --quiet "pyyaml==6.0.2"
      - name: Install Lean 4.34.1 via elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: v0.2 unit and end-to-end tests
        run: python -m unittest discover -s tests/v02 -v
      - name: Fidelity benchmark
        run: python -m proofscope.fidelity benchmark --scan examples/lean --out proofscope-fidelity-evidence
      - name: Job summary
        if: always()
        run: cat proofscope-fidelity-evidence/proofscope_report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload evidence (even if a step fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofscope-fidelity-evidence
          path: |
            proofscope-fidelity-evidence/proofscope_report.md
            proofscope-fidelity-evidence/proofscope_report.json
            proofscope-fidelity-evidence/work/**/*.lean
          if-no-files-found: warn
          retention-days: 30
